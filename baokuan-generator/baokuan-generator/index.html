<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爆款内容选题生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --border: #e4e2db;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-muted: #9a9a9a;
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-text: #0F6E56;
      --purple-light: #EEEDFE;
      --purple-text: #3C3489;
      --coral-light: #FAECE7;
      --coral-text: #993C1D;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-pill: 99px;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    /* Header */
    .header { margin-bottom: 2rem; }
    .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .header p { font-size: 14px; color: var(--text-secondary); margin-top: 6px; line-height: 1.6; }
    .version-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; padding: 3px 10px; border-radius: var(--radius-pill);
      background: var(--green-light); color: var(--green-text);
      white-space: nowrap; margin-top: 4px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

    .field label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .field input {
      width: 100%; height: 40px; padding: 0 12px;
      font-size: 14px; font-family: inherit;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text-primary);
      outline: none; transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--green); }

    .field-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
    .platform-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .ptag {
      padding: 7px 16px; border-radius: var(--radius-pill);
      border: 1px solid var(--border); font-size: 13px;
      cursor: pointer; color: var(--text-secondary);
      background: var(--bg); transition: all 0.15s;
      user-select: none; font-family: inherit;
    }
    .ptag:hover { border-color: var(--green); color: var(--green); }
    .ptag.active { background: var(--green); border-color: var(--green); color: #fff; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

    .gen-btn {
      width: 100%; height: 44px;
      background: var(--text-primary); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 500; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.15s;
    }
    .gen-btn:hover { opacity: 0.85; }
    .gen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .results { display: flex; flex-direction: column; gap: 10px; }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      animation: fadeUp 0.3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .card-index {
      font-size: 11px; font-weight: 500; color: var(--text-muted);
      background: var(--bg); padding: 2px 8px; border-radius: var(--radius-pill);
    }
    .dir-badge { font-size: 11px; padding: 2px 10px; border-radius: var(--radius-pill); font-weight: 500; }
    .dir-0 { background: var(--green-light); color: var(--green-text); }
    .dir-1 { background: var(--purple-light); color: var(--purple-text); }
    .dir-2 { background: var(--coral-light); color: var(--coral-text); }
    .platform-pill {
      font-size: 11px; padding: 2px 10px; border-radius: var(--radius-pill);
      border: 1px solid var(--border); color: var(--text-secondary);
    }

    .card-title { font-size: 16px; font-weight: 700; line-height: 1.5; margin-bottom: 8px; }
    .card-hook { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill);
      border: 1px solid var(--border); color: var(--text-muted);
    }
    .post-time { font-size: 11px; color: var(--text-muted); }

    /* Empty / Error */
    .empty-state { text-align: center; padding: 2.5rem 0; color: var(--text-muted); }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; }

    .error-msg {
      font-size: 13px; color: #993C1D; padding: 12px;
      border: 1px solid #F5C4B3; border-radius: var(--radius-sm);
      background: var(--coral-light);
    }

    /* Footer */
    .footer { text-align: center; margin-top: 2.5rem; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="header-top">
        <div>
          <h1>爆款内容选题生成器</h1>
          <p>输入品类和目标人群，选择发布平台，一键生成差异化选题与爆款标题</p>
        </div>
        <span class="version-badge">✦ 已学习账号风格</span>
      </div>
    </div>

    <div class="card">
      <div class="form-grid">
        <div class="field">
          <label>内容品类</label>
          <input type="text" id="category" placeholder="例：气动头盔" />
        </div>
        <div class="field">
          <label>目标人群</label>
          <input type="text" id="audience" placeholder="例：20-30岁咖啡骑车友" />
        </div>
      </div>

      <div class="field-label">目标平台（可多选）</div>
      <div class="platform-row" id="platforms">
        <button class="ptag active" data-val="小红书">小红书</button>
        <button class="ptag active" data-val="抖音">抖音</button>
        <button class="ptag active" data-val="微信私域">微信私域</button>
      </div>

      <div class="divider"></div>

      <button class="gen-btn" id="genBtn" onclick="generate()">
        ✦ 生成爆款选题
      </button>
    </div>

    <div id="output">
      <div class="empty-state">
        <div class="empty-icon">💡</div>
        <p>填写品类和平台，点击生成</p>
      </div>
    </div>

    <div class="footer">由 Claude AI 驱动 · 内置真实账号标题风格</div>
  </div>

  <script>
    document.querySelectorAll('.ptag').forEach(t => {
      t.addEventListener('click', () => t.classList.toggle('active'));
    });

    async function generate() {
      const category = document.getElementById('category').value.trim();
      const audience = document.getElementById('audience').value.trim();
      const platforms = [...document.querySelectorAll('.ptag.active')].map(t => t.dataset.val);

      if (!category) { alert('请输入内容品类'); return; }
      if (platforms.length === 0) { alert('请至少选择一个平台'); return; }

      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> 生成中...';
      document.getElementById('output').innerHTML = '';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category, audience, platforms })
        });

        const data = await res.json();

        if (data.error) throw new Error(data.error);

        const dirClasses = ['dir-0', 'dir-1', 'dir-2'];
        const output = document.getElementById('output');
        output.innerHTML = '<div class="results" id="results"></div>';
        const results = document.getElementById('results');

        data.topics.forEach((t, i) => {
          const card = document.createElement('div');
          card.className = 'result-card';
          card.style.animationDelay = (i * 0.08) + 's';
          card.innerHTML = `
            <div class="card-meta">
              <span class="card-index">选题 ${i + 1}</span>
              <span class="dir-badge ${dirClasses[i % 3]}">${t.direction}</span>
              <span class="platform-pill">${t.platform}</span>
            </div>
            <div class="card-title">${t.title}</div>
            <div class="card-hook">${t.hook}</div>
            <div class="card-footer">
              <div class="tags">${t.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}</div>
              <div class="post-time">⏰ ${t.post_time}</div>
            </div>
          `;
          results.appendChild(card);
        });

      } catch (err) {
        document.getElementById('output').innerHTML =
          `<div class="error-msg">生成失败：${err.message}，请稍后重试</div>`;
      }

      btn.disabled = false;
      btn.innerHTML = '✦ 重新生成';
    }
  </script>
</body>
</html>
